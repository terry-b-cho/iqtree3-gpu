# =============================================================================
#  CI for IQ-TREE3-GPU.
#
#  GitHub's hosted runners have no NVIDIA GPU, so CI can never prove the kernel is CORRECT -- that
#  requires a device and is what scripts/run_tests.sh --gpu is for. What CI CAN prove, and what
#  actually breaks in practice, is:
#     1. the scripts parse and the repository invariants hold (quick tier),
#     2. the patch still applies to the pinned upstream commit,
#     3. the Docker and Apptainer recipes build a working binary from this checkout and the worked
#        example runs inside each image (on the CPU, where the script still proves RF = 0).
#
#  Paths below are relative to the repository root.
# =============================================================================
name: CI

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick:
    name: Syntax, paths and data invariants (no GPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install the analysis dependencies the checks import
        run: python -m pip install --quiet numpy matplotlib pypdf
      - name: Run the quick tier
        run: bash scripts/run_tests.sh --quick

  patch-applies:
    name: GPU patch applies to the pinned IQ-TREE commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone upstream at the pin and apply
        run: |
          PIN=$(grep -oE '^PIN=[0-9a-f]+' build_iqtree_gpu.sh | cut -d= -f2)
          echo "pinned upstream commit: $PIN"
          git clone --filter=blob:none https://github.com/iqtree/iqtree3.git /tmp/iqtree3
          git -C /tmp/iqtree3 checkout -q "$PIN"
          git -C /tmp/iqtree3 apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/src/iqtree3_gpu.patch"
          echo "patch applies cleanly"

  docker-image:
    name: Docker image builds; worked example runs inside it (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the CUDA devel base image is several GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - name: Build the image from this checkout
        run: docker build -f containers/Dockerfile -t iqtree3-gpu:ci .
      - name: The binary starts
        run: docker run --rm iqtree3-gpu:ci iqtree3 --version | head -1
      - name: Worked example inside the image (no GPU on hosted runners; RF = 0 is still checked)
        run: |
          docker run --rm -v "$PWD":/work -w /work/examples iqtree3-gpu:ci ./run_example.sh iqtree3 | tee example.log
          grep -q 'VERDICT\[example\]: PASS' example.log

  apptainer-image:
    name: Apptainer image builds; worked example runs inside it (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: eWaterCycle/setup-apptainer@v2
        with: { apptainer-version: 1.3.6 }
      - name: Free disk space and spread the build over both runner disks
        # Unpacking the CUDA base image needs ~8 GB of scratch and the SIF is ~5.5 GB; the size of
        # the runner's /mnt data disk varies, so scratch goes to /mnt, the image to /, and the
        # layer cache is disabled (it would be a third copy of the base image).
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null 2>&1 || true
          sudo mkdir -p /mnt/apptainer-tmp && sudo chown "$USER" /mnt/apptainer-tmp
          echo "APPTAINER_TMPDIR=/mnt/apptainer-tmp" >> "$GITHUB_ENV"
          echo "SIF=$RUNNER_TEMP/iqtree3-gpu.sif" >> "$GITHUB_ENV"
          df -h / /mnt | tail -2
      - name: Build the image from this checkout
        run: sudo -E apptainer build --disable-cache "$SIF" containers/apptainer.def
      - name: The binary starts (and the recipe's %test passes)
        run: |
          apptainer exec "$SIF" iqtree3 --version | head -1
          apptainer test "$SIF"
      - name: Worked example inside the image (no GPU on hosted runners; RF = 0 is still checked)
        run: |
          cd examples
          apptainer exec "$SIF" ./run_example.sh iqtree3 | tee example.log
          grep -q 'VERDICT\[example\]: PASS' example.log

  # PLACEHOLDER: a self-hosted GPU runner would enable the real correctness gate.
  # gpu:
  #   runs-on: [self-hosted, gpu]
  #   steps:
  #     - uses: actions/checkout@v4
  #     - run: bash build_iqtree_gpu.sh "$RUNNER_TEMP/build"
  #     - run: bash scripts/run_tests.sh --gpu
